name: Apply Codex review fixes

on:
  push:
    branches:
      - fix/codex-review-2026.9.3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed fixes
        run: python tools/apply_codex_review_fixes.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: address Codex review findings"
          git push origin HEAD:fix/codex-review-2026.9.3
